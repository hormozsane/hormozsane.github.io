const A="assets/",left=["about.png","setar-03.JPG"],right=["saz-zadan3.JPG","portrait.JPG","kham.JPG"],works=[["خسرو خوبان (خسرو شکیبایی)","Khosrow-e Khuban (Khosrow Shakibaei)","",undefined,undefined,undefined,"ضبط در استودیو شبکه صداوسیما و پخش از شبکه 4 برنامه 2 قدم مانده به صبح","Studio recording at the IRIB studio and broadcast on Channel 4 in the program “Two Steps Away from Morning”."],["کوچه‌پس‌کوچه‌های خیال","The Alleys of Imagination","kooche.mp3",undefined,undefined,undefined,"ضبط و اجرا در سالن رودکی","Recording and performance at Rudaki Hall"],["مقدمه و تنظیم برای گروه سه‌تار روی تصنیف قدیمی","Introduction and Arrangement for Setar Ensemble",""],["نسیم غروب شنزار","Desert Evening Breeze",""],["فانتزی سیگار خاموش","Silent Cigarette Fantasy","",undefined,undefined,undefined,"تنظیم و اجرا در یوکوهاما","Arrangement and performance in Yokohama"],["فانتزی حماسی توهم کرکس","Epic Fantasy: Karkas Illusion","karkas.mp3",30,15,3,"اجرایی حماسی و متفاوت در یوکوهاما","An epic and distinctive performance in Yokohama"],["شب زرتشت","Zoroaster’s Night","",undefined,undefined,undefined,"اجرا در اوتویا کینتوکی، توکیو","Performance at Otoya Kintoki, Tokyo"],["Hey Stanley","Hey Stanley",""],["کمی مواج","Somewhat Wavy","mavvag.mp3"],["دگره‌ای ناگاه","Degarei Nagah","daghareh.mp3",40,0,9,"قطعه‌ای متفاوت","A distinctive piece"],["مادرانه، تا همیشه","Motherly, Forever",""],["حس سبز","Green Sense","hess.mp3"]];let lang="en",section="home",eventView="past",playing=null,li=0,ri=0,audio=new Audio(),clickAudio=null;audio.preload="auto";const faNav=[["home","معرفی"],["about","درباره هرمز"],["audio","آثار صوتی"],["events","اجراها و رویدادها"],["contact","در تماس"]],enNav=[["home","Home"],["about","About Hormoz"],["audio","Selected Audio Works"],["events","Performances & Events"],["contact","Contact"]];function playClick(){if(!clickAudio)clickAudio=new Audio(A+"button-pic.mp3");clickAudio.currentTime=0;clickAudio.volume=1;clickAudio.play().catch(()=>{})}function play(src,key,max,start=0,fade=3,hero=false){if(hero)playClick();audio.pause();audio.loop=false;audio.src=A+src;audio.load();audio.volume=.8;playing=key;render();audio.onloadedmetadata=()=>{audio.currentTime=start;audio.play().catch(()=>{playing=null;render()})};audio.ontimeupdate=()=>{if(max!==undefined){let end=start+max,rem=end-audio.currentTime;if(rem<=fade&&rem>0)audio.volume=.8*rem/fade;if(audio.currentTime>=end){audio.pause();audio.currentTime=0;playing=null;render()}}};audio.onended=()=>{playing=null;render()}}setInterval(()=>{li=(li+1)%left.length;ri=(ri+1)%right.length;if(section==="home")render()},30000);function pulseTab(k){requestAnimationFrame(()=>{let b=document.querySelector(`.tab[data-section="${k}"]`);if(!b)return;b.classList.add('clicked');setTimeout(()=>b.classList.remove('clicked'),420)})}function setLanguage(next){lang=next;render()}function nav(){return(lang==="en"?enNav:faNav).map(([k,t])=>`<button class="tab ${section===k?"active":""}" data-section="${k}" onclick="section='${k}';render();pulseTab('${k}')">${t}</button>`).join("")}function hero(){let L=left.map((s,i)=>`<img class="heroImage ${i===li?"visible":"hidden"}" src="${A+s}" alt="Setar detail">`).join(""),R=right.map((s,i)=>`<img class="heroImage ${i===ri?"visible":"hidden"}" src="${A+s}" alt="Hormoz Sane portrait">`).join("");return`<section class="hero"><div class="gallery"><div class="photoFrame">${L}<div class="audioHalf audioHalfLeft" onclick="play('mavvag.mp3','Mavvaj',undefined,0,3,true)"></div><div class="audioHalf audioHalfRight" onclick="play('karkas.mp3','Karkas Illusion',undefined,0,3,true)"></div></div><div class="photoFrame">${R}<div class="audioHalf audioHalfLeft" onclick="play('hess.mp3','Green Sense',undefined,0,3,true)"></div><div class="audioHalf audioHalfRight" onclick="play('kooche.mp3','Koocheh-Pas-Koocheh Khial',undefined,0,3,true)"></div></div></div><div class="identity"><div class="official">${lang==="en"?"OFFICIAL WEBSITE":"وبسایت رسمی"}</div><h1>${lang==="en"?"HORMOZ SANE":"هرمز صانع"}</h1><p>${lang==="en"?"Persian musician and music researcher, focused on the setar and exploring connections between Persian music and other cultures.":"نوازنده و پژوهشگر موسیقی ایران، با تمرکز بر ساز سه‌تار و تجربه در پیوند موسیقی ایران با ملل"}</p></div></section>`}function content(title,body){return`<section class="content"><h2>${title}</h2><div class="mark"></div><div class="copy">${body}</div></section>`}function about(){return`<section class="aboutPage"><img class="aboutBackground" src="${A}about.png"><div class="aboutOverlay"></div><div class="aboutScroll"><h2>${lang==="en"?"About Hormoz":"درباره هرمز"}</h2><div class="mark"></div><div class="copy"><p>${lang==="en"?"Born in Tehran in the autumn of the early 1980s, Hormoz Sane is a musician, composer, and researcher of Iranian music.":"متولد پاییز طهران، در ابتدای طلوع دهه ۸۰ میلادی؛ نوازنده، آهنگساز و پژوهشگر موسیقی."}</p><p>${lang==="en"?"After years of working in music, teaching, and performing with ensembles, a desire for deeper understanding led Hormoz Sane toward a new path. He gradually reduced his teaching activities and travelled to other countries, experiencing music and the formation of a multicultural perspective at close range.":"پس از سال‌ها فعالیت در موسیقی، آموزش و همراهی با گروه‌ها، نیاز به فهمیدن بیشتر، هرمز صانع را به مسیری تازه کشاند؛ از حجم تدریس خود کاست و راهی کشورهای دیگر شد تا موسیقی و شکل‌گیری نگاه چندفرهنگی را از نزدیک لمس کند."}</p><p>${lang==="en"?"In Lebanon, he studied books on Arab maqams and encountered another part of the region’s musical world.":"در لبنان، به پژوهش در کتاب‌های مقام‌های عربی پرداخت و با بخشی دیگر از جهان موسیقی منطقه روبه‌رو شد."}</p><p>${lang==="en"?"In Japan, everything initially appeared modern and Western, yet it gradually became clear that Japan was not New York. In architecture and spatial design, a distinct Japanese signature remained — perhaps not always obvious, but present in the atmosphere and details.":"در ژاپن، همه‌چیز مدرن و غربی به نظر می‌رسید؛ اما در نهایت می‌شد احساس کرد اینجا با نیویورک تفاوت دارد. در معماری و حجم‌سازی، هنوز امضای ژاپن حضور داشت؛ امضایی که شاید همیشه قابل لمس نباشد، اما در فضا و جزئیات جریان دارد."}</p><p>${lang==="en"?"This experience led Hormoz to a new understanding of his own music: belonging to authentic roots and traditions does not prevent new experiences. Those roots can remain intact while musical phrases become more energetic, yet also deeper, quieter, and more open to new ideas.":"این تجربه، هرمز را به دریافت تازه‌ای از موسیقی خود رساند؛ اینکه تعلق به مکتب‌ها و ریشه‌های اصیل، مانعی برای تجربه‌های تازه نیست. می‌توان با حفظ این ریشه‌ها، با جمله‌سازی‌هایی پرهیجان، اما همراه با عمق و سکوت بیشتر، حرف‌هایی جدی‌تر و جدیدتر زد."}</p><p>${lang==="en"?"On the way to a concert in Yokohama, two different ideas came to him, each later taking shape in his work in its own way. One became “Karkas Illusion”, which is also presented among the works on this website.":"در مسیر بازگشت به این نگاه، در راه کنسرتی در یوکوهاما دو ایده متفاوت نیز به ذهن هرمز رسید که بعدها هرکدام به شکلی در آثار او ادامه پیدا کردند. یکی از آنها «توهم کرکس» است؛ اثری که در بخش آثار قابل تهیه سایت نیز معرفی خواهد شد."}</p><p>${lang==="en"?"Later, another form of musical expression began to take shape in his mind, built around the central phrase of Surah At-Takwir.":"در ادامه، شکل‌گیری نوع دیگری از بیان در ذهن او آغاز شد؛ تجربه‌ای که در قالب جمله اصلی سوره تکویر شکل گرفت."}</p><p>${lang==="en"?"“Degarei Nagah” grew from this experience: a piece shaped boldly and passionately around a ten-minute idea, then written and recorded with three friends in less than eight hours.":"«دگره‌ای ناگاه» حاصل همین تجربه است؛ قطعه‌ای که هرمز آن را بی‌پروا و عاشقانه، با ایده‌ای ده‌دقیقه‌ای شکل داد و در کمتر از هشت ساعت، با همکاری سه دوست، نوشته و ضبط شد."}</p><p>${lang==="en"?"Today, this path remains a continuation of the same search for Hormoz Sane — a search between roots and the connections that grow from them.":"امروز، این مسیر برای هرمز صانع ادامه همان جست‌وجوست؛ جست‌وجویی میان ریشه‌ها و پیوند آنها."}</p></div></div></section>`}const eventCalendar=[["JANUARY",[["2001","Duet performance at the Sooreh University Conference Hall."],["2013","Concert in Yokohama, Japan."]]],["FEBRUARY",[["2004–2007","Ensemble performances with the Hamsaz Group at the Fajr International Music Festival."],["2014","Concert in Tokyo, Japan."],["2014","Concert at Otoya Kintoki, Tokyo."]]],["MARCH",[["2006","Composition of three soundtracks for short films for the Young Cinema Society."],["2014","Fourteen workshops on Iranian music at Shinkoyasu, Japan."]]],["APRIL",[["2007","Composition of the title music for ba mashahir (With the Celebrities), a 60-episode television series broadcast on Channel 4."],["2008","Ensemble performance with the Hamsaz Group, led by Masoud Shaari."],["2015","Cancelled concert at Jihad Daneshgahi, Tehran."]]],["MAY",[["2008–2009","Recording of the album Sunset, under the musical direction and composition of Masoud Shaari, featuring vocalist Farahnaz Saheb-Ghalam."],["2008","Shab-e Rudaki performance, featuring vocalist Alireza Ghorbani and Hormoz Sane on bass setar."],["2020","Cancelled concert at Be Afarin Cultural Center."]]],["JUNE",[["2008–2009","Formation of the Dorrab Ensemble, led by Hormoz Sane."],["2009","Performance with the Dorrab Ensemble at Rudaki Hall, led by Hormoz Sane."],["2009","Bass setar performance at Rudaki Hall; improvisational performance in Isfahan."],["2021","Recording of all pieces originally prepared for the cancelled concerts, for future presentation."]]]];
