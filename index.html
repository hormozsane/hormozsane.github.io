<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORMOZ SANE — Official Website</title>
<meta name="description" content="Official website of Hormoz Sane, Persian musician, setar player, composer, and music researcher.">
<style>
:root{--green:#173b32;--gold:#d2ae49;--cream:#f3ead7;--brown:#87512f;--blue:#315f7d;--lightgreen:#356b55}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--green);color:var(--cream);font-family:Tahoma,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
#app{min-height:100vh}
.languageBar{position:fixed;top:18px;right:5%;z-index:100;display:flex;gap:10px;align-items:center;font-size:13px;text-shadow:0 1px 5px #000}
.langButton{border:0;background:transparent;color:var(--cream);padding:4px}
.langButton:hover{color:var(--gold)}
.nav{position:fixed;z-index:80;left:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tab{position:relative;width:auto;max-width:240px;border:1px solid #d2ae4940;border-radius:3px;background:#173b32d9;color:var(--cream);padding:10px 14px;text-align:start;font-size:13px;transition:background .2s,border-color .2s,width .2s}
.tab:hover,.tab.active{border-color:var(--gold);background:#23483c}
.tab.active:after{content:"✓";color:var(--gold);margin-inline-start:10px}
.tab.clicked{width:271px}
.tab.clicked::after{content:"";position:absolute;top:0;bottom:0;right:0;width:34%;background:linear-gradient(to right,rgba(23,59,50,0),rgba(23,59,50,.95));pointer-events:none;border-radius:3px}
.hero{height:100vh;min-height:650px;position:relative;overflow:hidden;background:var(--green)}
.gallery{position:absolute;z-index:5;left:7%;right:22%;top:12%;bottom:8%;display:flex;align-items:flex-start;justify-content:center;gap:24px;direction:ltr}
.photoFrame{position:relative;width:min(39vw,560px);aspect-ratio:1111/1245;overflow:hidden;border:2px solid rgba(220,195,160,.38);box-shadow:0 14px 42px #000b;background:#21160f}
.heroImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 1.2s ease}
.hidden{opacity:0}.visible{opacity:1}
.audioHalf{position:absolute;top:0;bottom:0;width:50%;z-index:8;cursor:pointer}
.audioHalfLeft{left:0}.audioHalfRight{right:0}
.audioHalf::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .28s ease;pointer-events:none;mix-blend-mode:color}
.audioHalf:hover::after{opacity:.195}
.photoFrame:nth-child(1) .audioHalfLeft::after{background:#87512f}
.photoFrame:nth-child(1) .audioHalfRight::after{background:#d6a21e}
.photoFrame:nth-child(2) .audioHalfLeft::after{background:#356b55}
.photoFrame:nth-child(2) .audioHalfRight::after{background:#315f7d}
.photoFrame:nth-child(2) .heroImage[src*="saz-zadan3"]{object-position:center top}
.photoFrame:nth-child(2) .heroImage[src*="kham"]{object-position:center 40%}
.identity{position:absolute;z-index:20;left:7%;right:auto;top:calc(31% - 2mm);width:min(30vw,420px);text-align:center;text-shadow:0 2px 8px #000}
.official{font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:500;letter-spacing:1.2px;margin-bottom:6px}
.identity h1{font-family:"Noto Nastaliq Urdu","Nastaliq",Georgia,serif;font-size:44px;font-weight:400;line-height:1.25;margin:0 auto 7px;padding:3px 28px 8px;width:max-content;max-width:100%;border:1px solid rgba(220,195,160,.65);border-radius:50%;box-shadow:0 0 0 5px rgba(220,195,160,.08)}
.identity p{font-size:18px;line-height:1.55;margin:0 auto;max-width:390px;text-shadow:0 3px 9px rgba(0,0,0,.10)}
.nowPlaying{position:fixed;z-index:50;left:7%;bottom:35px;background:#0009;padding:8px 14px;font:13px Tahoma}
.content{min-height:100vh;padding:9vh 20vw 12vh;background:var(--green);direction:inherit}
.content h2,.aboutScroll h2{font-family:"Noto Nastaliq Urdu","Nastaliq",Georgia,serif;font-size:31px;font-weight:400;text-align:center;margin:0 0 8px}
.mark{width:180px;height:2px;margin:10px auto 34px;background:linear-gradient(to right,var(--gold),rgba(210,174,73,.2),transparent)}
.contentIntro{text-align:center;color:#e4d3b1;line-height:1.9;margin:0 auto 32px;max-width:750px}
.workList{display:flex;flex-direction:column;gap:16px}
.work{border-bottom:1px solid #d2ae4938;padding:16px 0 22px}
.work h3{font-size:19px;font-weight:400;color:var(--gold);margin:0 0 8px}
.workDescription{font-size:14px;line-height:1.9;margin:6px 0 12px;color:#e8dfcb}
.play{border:1px solid var(--gold);background:transparent;color:var(--cream);padding:8px 17px;border-radius:2px;margin:8px 8px 0 0;font-size:13px}
.play:hover{background:#d2ae4920}
.articlesIntro{display:flex;flex-direction:column;gap:14px}
.articlesTitle{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid #d2ae4944;padding:17px 20px;color:var(--cream);text-decoration:none;line-height:1.9;transition:background .2s,border-color .2s}
.articlesTitle:hover{background:#21473a;border-color:var(--gold)}
.articleChevron{color:var(--gold);font-size:19px}
.aboutPage{height:100vh;min-height:600px;position:relative;overflow:hidden;background:var(--green)}
.aboutBackground{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25}
.aboutOverlay{position:absolute;inset:0;background:linear-gradient(90deg,#173b32ee,#173b32b8)}
.aboutScroll{position:relative;z-index:2;height:100%;overflow-y:auto;padding:9vh 20vw 12vh;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.aboutScroll .copy{font-family:"Noto Nastaliq Urdu","Nastaliq",Georgia,serif;font-size:20px;line-height:2.4}
.aboutScroll .copy p{margin:0 0 24px}
.aboutScroll::-webkit-scrollbar{width:5px}
.aboutScroll::-webkit-scrollbar-thumb{background:var(--gold)}
.aboutScroll::-webkit-scrollbar-track{background:transparent}
.eventsPanel{max-width:850px;margin:auto}
.eventsSwitch{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.eventsView{border:1px solid #d2ae4970;background:transparent;color:var(--cream);padding:10px 15px;font-size:12px}
.eventsView.active,.eventsView:hover{background:#23483c;border-color:var(--gold)}
.experienceYears{text-align:center;color:var(--gold);font-family:Georgia,serif;letter-spacing:1px;margin:0 0 24px}
.pastLines{display:flex;flex-direction:column;gap:0}
.pastLine{display:grid;grid-template-columns:105px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid #d2ae4930;line-height:1.9;font-size:14px}
.pastLine b{font-family:Georgia,serif;color:var(--gold);font-weight:400}
.calendarGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.calendarMonth{border:1px solid #d2ae4938;padding:14px}
.calendarMonth h3{text-align:center;color:var(--gold);font:16px Georgia,serif;margin:0 0 14px}
.calendarWeek,.calendarDays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:3px}
.calendarWeek{font-size:10px;color:var(--gold);margin-bottom:8px}
.calendarDays span{padding:5px 0;font-size:11px;background:#ffffff05}
.contactGrid{display:grid;grid-template-columns:1fr 1.5fr;gap:35px;max-width:800px;margin:auto}
.contactGrid>div{line-height:2}
.contactGrid>div span{font:12px Georgia,serif;letter-spacing:1px;color:var(--gold)}
.contactGrid>div a{color:var(--cream);text-decoration:none}
.contactGrid>div a:hover{color:var(--gold)}
#contactForm{display:flex;flex-direction:column;gap:12px}
#contactForm input,#contactForm textarea{width:100%;border:1px solid #d2ae4940;background:#102d26;color:var(--cream);padding:12px;outline:none}
#contactForm input:focus,#contactForm textarea:focus{border-color:var(--gold)}
#contactForm button{align-self:flex-start;border:1px solid var(--gold);background:transparent;color:var(--cream);padding:10px 20px}
#contactForm button:hover{background:#d2ae4920}
#contactStatus{font-size:12px;line-height:1.8}
.footer{text-align:center;padding:20px 12px;color:#eadcc3;border-top:1px solid #ffffff22;font:13px Georgia,serif}
.educationBlock{max-width:760px;margin:auto;text-align:center;line-height:2}
.educationBlock a{color:var(--gold)}
[dir="rtl"] .nav{left:auto;right:22px;align-items:flex-end}
[dir="rtl"] .tab.active:after{margin-inline-start:0;margin-inline-end:10px}
[dir="rtl"] .content{text-align:right}
[dir="rtl"] .pastLine{grid-template-columns:105px 1fr}
[dir="rtl"] .pastLine b{grid-column:2;grid-row:1}
[dir="rtl"] .pastLine span{grid-column:1;grid-row:1}
[dir="rtl"] .aboutOverlay{background:linear-gradient(270deg,#173b32ee,#173b32b8)}
[dir="rtl"] .play{margin:8px 0 0 8px}
@media(max-width:800px){
 .gallery{left:5%;right:5%;top:15%;bottom:18%;gap:12px}
 .photoFrame{width:48%;height:auto}
 .identity{left:5%;right:5%;top:auto;bottom:5%;width:auto}
 .identity h1{font-size:35px}
 .identity p{font-size:14px;max-width:330px}
 .official{font-size:12px}
 .nav{left:8px;top:auto;bottom:10px;transform:none;gap:5px}
 .tab{font-size:10px;padding:7px 9px;max-width:160px}
 .tab.clicked{width:180px}
 .languageBar{top:10px;right:4%}
 .content{padding:85px 8vw 110px}
 .aboutScroll{padding:85px 8vw 110px}
 .aboutScroll .copy{font-size:17px}
 .calendarGrid{grid-template-columns:1fr}
 .contactGrid{grid-template-columns:1fr}
}
@media(max-width:460px){
 .hero{min-height:720px}
 .gallery{top:14%;bottom:26%;gap:8px}
 .photoFrame{width:49%}
 .identity h1{font-size:30px}
 .identity p{font-size:12px}
 .tab{font-size:9px;padding:6px 7px}
 .nav{left:5px;bottom:5px}
 [dir="rtl"] .nav{left:auto;right:5px}
 .content h2,.aboutScroll h2{font-size:26px}
 .pastLine{grid-template-columns:75px 1fr;gap:10px;font-size:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const A="";
const left=["setar-detail.png","setar-zadan3.png"];
const right=["hormoz-portrait.png","kham.png"];
const works=[
["فانتزی سیگار خاموش","Silent Cigarette Fantasy","",undefined,undefined,undefined,"تنظیم و اجرا در یوکوهاما","Arrangement and performance in Yokohama"],
["فانتزی حماسی توهم کرکس","Epic Fantasy: Karkas Illusion","karkas.mp3",30,15,3,"اجرایی حماسی و متفاوت در یوکوهاما","An epic and distinctive performance in Yokohama"],
["شب زرتشت","Zoroaster’s Night","",undefined,undefined,undefined,"اجرا در اوتویا کینتوکی، توکیو","Performance at Otoya Kintoki, Tokyo"],
["Hey Stanley","Hey Stanley",""],
["کمی مواج","Somewhat Wavy","mavvag.mp3"],
["دگره‌ای ناگاه","Degarei Nagah","daghareh.mp3",40,0,9,"قطعه‌ای متفاوت","A distinctive piece"],
["مادرانه، تا همیشه","Motherly, Forever",""],
["حس سبز","Green Sense","hess.mp3"],
["کوچه‌پس‌کوچه خیال","The Alleys of Imagination","kooche.mp3",30,0,3,"ضبط و اجرا در سالن رودکی","Recording and performance at Rudaki Hall"],
["مقدمه و تنظیم برای گروه سه‌تار روی تصنیف قدیمی","Introduction and Arrangement for Setar Ensemble",""],
["نسیم غروب شنزار","Desert Evening Breeze",""],
["خسرو خوبان","Khosrow-e Khuban","",undefined,undefined,undefined,"ضبط در استودیو صداوسیمای جمهوری اسلامی و پخش از برنامهٔ دو قدم مانده به صبح، شبکهٔ چهار","Recorded at the IRIB studio and broadcast on Channel 4’s programme 2 Ghadam Mande Be Sobh"]
];
let lang="en",section="home",eventView="past",playing=null,li=0,ri=0,audio=new Audio(),clickAudio=null;
audio.preload="auto";
const faNav=[["home","معرفی"],["about","درباره هرمز"],["audio","آثار صوتی"],["articles","یادداشت‌های صانع"],["events","اجراها و رویدادها"],["education","آموزش"],["contact","در تماس"]];
const enNav=[["home","Home"],["about","About Hormoz"],["audio","Selected Audio Works"],["articles","Sane’s Articles"],["events","Performances & Events"],["education","Education"],["contact","Contact"]];
function playClick(){if(!clickAudio)clickAudio=new Audio(A+"button-pic.mp3");clickAudio.currentTime=0;clickAudio.volume=1;clickAudio.play().catch(()=>{})}
function play(src,key,max,start=0,fade=3,hero=false){
 if(hero)playClick();
 audio.pause();audio.loop=false;audio.src=A+src;audio.load();audio.volume=.8;playing=key;render();
 audio.onloadedmetadata=()=>{audio.currentTime=start;audio.play().catch(()=>{playing=null;render()})};
 audio.ontimeupdate=()=>{if(max!==undefined){let end=start+max,rem=end-audio.currentTime;if(rem<=fade&&rem>0)audio.volume=.8*rem/fade;if(audio.currentTime>=end){audio.pause();audio.currentTime=0;playing=null;render()}}};
 audio.onended=()=>{playing=null;render()}
}
setInterval(()=>{li=(li+1)%left.length;ri=(ri+1)%right.length;if(section==="home")render()},30000);
function pulseTab(k){requestAnimationFrame(()=>{let b=document.querySelector(`.tab[data-section="${k}"]`);if(!b)return;b.classList.add('clicked');setTimeout(()=>b.classList.remove('clicked'),420)})}
function setLanguage(next){lang=next;render()}
function purchaseNotice(){alert(lang==="en"?"Due to currency exchange rate instability, this section is currently unavailable.":"به‌دلیل ناپایداری نرخ ارز، این بخش در حال حاضر فعال نیست.")}
function nav(){return(lang==="en"?enNav:faNav).map(([k,t])=>`<button class="tab ${section===k?"active":""}" data-section="${k}" onclick="section='${k}';render();pulseTab('${k}')">${t}</button>`).join("")}
function hero(){
 let L=left.map((s,i)=>`<img class="heroImage ${i===li?"visible":"hidden"}" src="${A+s}" alt="Setar detail">`).join("");
 let R=right.map((s,i)=>`<img class="heroImage ${i===ri?"visible":"hidden"}" src="${A+s}" alt="Hormoz Sane portrait">`).join("");
 return `<section class="hero"><div class="gallery"><div class="photoFrame">${L}<div class="audioHalf audioHalfLeft" onclick="play('mavvag.mp3','Mavvaj',undefined,0,3,true)"></div><div class="audioHalf audioHalfRight" onclick="play('karkas.mp3','Karkas Illusion',undefined,0,3,true)"></div></div><div class="photoFrame">${R}<div class="audioHalf audioHalfLeft" onclick="play('hess.mp3','Green Sense',undefined,0,3,true)"></div><div class="audioHalf audioHalfRight" onclick="play('kooche.mp3','Koocheh-Pas-Koocheh Khial',undefined,0,3,true)"></div></div></div><div class="identity"><div class="official">${lang==="en"?"OFFICIAL WEBSITE":"وبسایت رسمی"}</div><h1>${lang==="en"?"HORMOZ SANE":"هرمز صانع"}</h1><p>${lang==="en"?"Persian musician and music researcher, focused on the setar and exploring connections between Persian music and other cultures.":"نوازنده و پژوهشگر موسیقی ایرانی، با تمرکز بر ساز سه‌تار و تجربه در پیوند موسیقی ایران با ملل"}</p></div>${playing?`<div class="nowPlaying">${lang==="en"?"Now playing: ":"در حال پخش: "}${playing}</div>`:""}</section>`
}
function content(title,html){return `<section class="content"><h2>${title}</h2><div class="mark"></div>${html}</section>`}
function articles(){
 return content(lang==="en"?"Notes, reflections, and writings on music":"یادداشت‌ها، تأملات و نوشته‌هایی دربارهٔ موسیقی",`<div class="articlesIntro"><a class="articlesTitle articleToggle articleLink" href="articles/episode-1.html?lang=${lang}">${lang==="en"?"Episode 1 / Take 1 / Here Comes Spring":"اپیزود ۱ / برداشت ۱ / اینک بهار"} <span class="articleChevron">↗</span></a><a class="articlesTitle articleToggle articleLink" href="articles/episode-2.html?lang=${lang}">${lang==="en"?"Can a Non-Classical Instrumentalist Become a Composer?":"آیا نوازندهٔ ساز غیرکلاسیک می‌تواند آهنگسازی کند؟"} <span class="articleChevron">↗</span></a></div>`)
}
function about(){
 return `<section class="aboutPage"><img class="aboutBackground" src="${A}about.png" alt=""><div class="aboutOverlay"></div><div class="aboutScroll"><h2>${lang==="en"?"About Hormoz":"درباره هرمز"}</h2><div class="mark"></div><div class="copy"><p>${lang==="en"?"Born in Tehran in the autumn of the early 1980s, Hormoz Sane is a musician, composer, and researcher of Iranian music.":"متولد پاییز طهران، در ابتدای طلوع دهه ۸۰ میلادی؛ نوازنده، آهنگساز و پژوهشگر موسیقی."}</p><p>${lang==="en"?"After years of working in music, teaching, and performing with ensembles, a desire for deeper understanding led Hormoz Sane toward a new path. He gradually reduced his teaching activities and travelled to other countries, experiencing music and the formation of a multicultural perspective at close range.":"پس از سال‌ها فعالیت در موسیقی، آموزش و همراهی با گروه‌ها، نیاز به فهمیدن بیشتر، هرمز صانع را به مسیری تازه هدایت کرد. او به‌تدریج فعالیت آموزشی خود را کمتر کرد و با سفر به کشورهای دیگر، موسیقی و شکل‌گیری نگاهی چندفرهنگی را از نزدیک تجربه کرد."}</p><p>${lang==="en"?"“Karkas Illusion” and “Degarei Nagah” grew from this experience: works shaped through bold musical exploration and collaboration.":"«توهم کرکس» و «دگره‌ای ناگاه» حاصل همین تجربه‌اند؛ آثاری شکل‌گرفته از جست‌وجوی موسیقایی جسورانه و همکاری."}</p><p>${lang==="en"?"Today, this path remains a continuation of the same search for Hormoz Sane — a search between roots and the connections that grow from them.":"امروز، این مسیر برای هرمز صانع ادامه همان جست‌وجوست؛ جست‌وجویی میان ریشه‌ها و پیوند آنها."}</p></div></div></section>`
}
function education(){
 return content(lang==="en"?"Education":"آموزش",`<div class="educationBlock"><p>${lang==="en"?"For inquiries about lessons and musical collaboration, please use the contact form.":"برای پرسش دربارهٔ آموزش و همکاری موسیقایی، از فرم تماس استفاده کنید."}</p><a href="#contact" onclick="section='contact';render()">${lang==="en"?"Contact":"در تماس"}</a></div>`)
}
const eventCalendar=[["JANUARY",[["2001","Duet performance at the Sooreh University Conference Hall."],["2013","Concert in Yokohama, Japan."]]],[ "FEBRUARY",[["2004–2007","Ensemble performances with the Hamsaz Group at the Fajr International Music Festival."],["2014","Concert in Tokyo, Japan."],["2014","Concert at Otoya Kintoki, Tokyo."]]],[ "MARCH",[["2006","Composition of three soundtracks for short films for the Young Cinema Society."],["2014","Fourteen workshops on Iranian music at Shinkoyasu, Japan."]]],[ "APRIL",[["2007","Composition of the title music for ba mashahir (With the Celebrities), a 60-episode television series broadcast on Channel 4."],["2008","Ensemble performance with the Hamsaz Group, led by Masoud Shaari."],["2015","Cancelled concert at Jihad Daneshgahi, Tehran."]]],[ "MAY",[["2008–2009","Recording of the album Sunset, under the musical direction and composition of Masoud Shaari, featuring vocalist Farahnaz Saheb-Ghalam."],["2008","Shab-e Rudaki performance, featuring vocalist Alireza Ghorbani and Hormoz Sane on bass setar."],["2020","Cancelled concert at Be Afarin Cultural Center."]]],[ "JUNE",[["2008–2009","Formation of the Dorrab Ensemble, led by Hormoz Sane."],["2009","Performance with the Dorrab Ensemble at Rudaki Hall, led by Hormoz Sane."],["2009","Bass setar performance at Rudaki Hall; improvisational performance in Isfahan."],["2021","Recording of all pieces originally prepared for the cancelled concerts, for future presentation."]]]];
const pastEvents=[
["2001","اجرای دوئت در سالن کنفرانس دانشگاه سوره.","Duet performance at the Sooreh University Conference Hall."],
["2004–2007","اجرا با گروه همساز در جشنواره بین‌المللی موسیقی فجر.","Ensemble performances with the Hamsaz Group at the Fajr International Music Festival."],
["2006","ساخت سه موسیقی متن برای فیلم‌های کوتاه انجمن سینمای جوان.","Composition of three soundtracks for short films for the Young Cinema Society."],
["2007","ساخت موسیقی تیتراژ مجموعه ۶۰ قسمتی «با مشاهیر» پخش‌شده از شبکه چهار.","Composition of the title music for ba mashahir (With the Celebrities), a 60-episode television series broadcast on Channel 4."],
["2008","اجرای گروهی با گروه همساز به سرپرستی مسعود شعاری.","Ensemble performance with the Hamsaz Group, led by Masoud Shaari."],
["2008–2009","ضبط آلبوم Sunset به آهنگسازی و سرپرستی مسعود شعاری با آواز فرحناز صاحب‌قلم.","Recording of the album Sunset, under the musical direction and composition of Masoud Shaari, featuring vocalist Farahnaz Saheb-Ghalam."],
["2008","اجرای شب رودکی با آواز علیرضا قربانی و هرمز صانع با سه‌تار باس.","Shab-e Rudaki performance, featuring vocalist Alireza Ghorbani and Hormoz Sane on bass setar."],
["2008–2009","تشکیل گروه دوراب به سرپرستی هرمز صانع.","Formation of the Dorrab Ensemble, led by Hormoz Sane."],
["2009","اجرای گروه دوراب در تالار رودکی به سرپرستی هرمز صانع.","Performance with the Dorrab Ensemble at Rudaki Hall, led by Hormoz Sane."],
["2009","اجرای سه‌تار باس در تالار رودکی؛ اجرای بداهه در اصفهان.","Bass setar performance at Rudaki Hall; improvisational performance in Isfahan."],
["2013","کنسرت در یوکوهاما، ژاپن.","Concert in Yokohama, Japan."],

function nextSixMonths(){
 const locale="en-US-u-ca-gregory",monthFmt=new Intl.DateTimeFormat(locale,{month:"long",year:"numeric"}),weekFmt=new Intl.DateTimeFormat(locale,{weekday:"short"}),today=new Date(),out=[];
 today.setDate(1);
 for(let m=0;m<6;m++){
  const first=new Date(today.getFullYear(),today.getMonth()+m,1),last=new Date(first.getFullYear(),first.getMonth()+1,0),cells=Array(first.getDay()).fill(null);
  for(let d=1;d<=last.getDate();d++)cells.push(d);
  while(cells.length%7)cells.push(null);
  out.push({label:monthFmt.format(first),weekdays:Array.from({length:7},(_,i)=>weekFmt.format(new Date(2024,0,7+i))),cells})
 }
 return out
}
let contactBound=false;
function bindContactForm(){
 if(contactBound)return;contactBound=true;
 document.addEventListener("submit",async e=>{
  const f=e.target;if(!f||f.id!=="contactForm")return;e.preventDefault();
  const b=f.querySelector("button[type=submit]"),st=f.querySelector("#contactStatus");b.disabled=true;st.textContent="Sending…";
  try{
   const formData=new FormData(f);
   const r=await fetch("https://api.web3forms.com/submit",{method:"POST",body:formData});
   const result=await r.json().catch(()=>({}));
   if(!r.ok||result.success===false)throw new Error(result.message||"send failed");
   f.reset();st.textContent="Message sent successfully. Thank you for getting in touch.";
  }catch(err){st.textContent="Sending failed. Please try again."}
  finally{b.disabled=false}
 })
}
