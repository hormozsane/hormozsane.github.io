*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#24170f;color:#f3ead7;font-family:Georgia,"Times New Roman",serif}button,input,textarea{font:inherit}body{overflow-x:hidden}.site{min-height:100vh;background:#24170f;position:relative;overflow-x:hidden}.languageBar{position:absolute;z-index:40;top:18px;left:24px;display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.8px}.langButton{background:none;border:0;color:#fff;cursor:pointer}.nav{position:fixed;right:1.5%;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:9px}.tab{position:relative;width:118px;height:40px;border:0;border-radius:3px;color:#fff;cursor:pointer;font:12px Tahoma;white-space:nowrap;box-shadow:0 2px 8px #0009;background:#173b32}.tab.active{background:#8b7134}.gallery{position:absolute;z-index:5;left:7%;right:22%;top:12%;bottom:8%;display:flex;align-items:flex-start;justify-content:center;gap:24px;direction:ltr}.photoFrame{position:relative;width:min(39vw,560px);aspect-ratio:1111/1245;overflow:hidden;border:2px solid rgba(220,195,160,.38);box-shadow:0 14px 42px #000b;background:#21160f}.heroImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 1.2s ease}.hidden{opacity:0}.visible{opacity:1}.audioHalf{position:absolute;top:0;bottom:0;width:50%;z-index:8;cursor:pointer}.audioHalfLeft{left:0}.audioHalfRight{right:0}.photoFrame:nth-child(2) .heroImage[src*="saz-zadan3"]{object-position:center top}.photoFrame:nth-child(2) .heroImage[src*="kham"]{object-position:center 40%}.identity{position:absolute;z-index:20;left:7%;right:52%;bottom:45%;text-align:center;text-shadow:0 2px 8px #000}.official{font:12px Tahoma;letter-spacing:2px}.identity h1{font-size:48px;font-weight:400;margin:12px 0}.identity p{font-size:18px;line-height:2;margin:0}.nowPlaying{position:fixed;z-index:50;left:7%;bottom:35px;background:#0009;padding:8px 14px;font:13px Tahoma}.content{min-height:100vh;padding:9vh 20vw 12vh;background:#173b32;color:#f3ead7;position:relative}.content h2{margin:0;text-align:right;font-size:58px;font-weight:400}.mark{width:180px;height:2px;margin:10px 0 34px auto;background:linear-gradient(to left,#d2ae49,rgba(210,174,73,.2),transparent)}.copy{max-width:850px;margin-left:auto;line-height:2;font-size:18px}.copy p{margin:0 0 22px}.workList{display:grid;gap:18px}.work{padding:18px 0;border-bottom:1px solid #ffffff26}.work h3{font-size:28px;font-weight:400;margin:0 0 10px}.play{border:1px solid #d2ae49;background:transparent;color:#f3ead7;padding:8px 18px;cursor:pointer}.aboutPage{height:100vh;min-height:100vh;position:relative;overflow:hidden;color:#f3ead7;background:#21160f}.aboutBackground{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}.aboutOverlay{position:absolute;inset:0;background:rgba(12,8,5,.52)}.aboutScroll{position:absolute;z-index:2;top:0;bottom:0;right:16vw;width:min(760px,60vw);height:100%;max-height:100vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;padding:14vh 4vw 18vh 2vw;line-height:2;font-size:19px;text-shadow:0 2px 10px #000;direction:ltr}.aboutScroll>*{direction:rtl}.contactGrid{display:grid;grid-template-columns:1fr 1.5fr;gap:50px;direction:ltr}.contactGrid>div,.contactGrid form{direction:rtl}.contactGrid a{color:#d2ae49}.contactGrid form{display:grid;gap:12px}.contactGrid input,.contactGrid textarea{background:#0d2923;border:1px solid #d2ae4966;color:#fff;padding:10px}.contactGrid button{width:max-content;background:#d2ae49;border:0;padding:10px 18px;cursor:pointer}.emptyEvent{font-size:20px}.footer{position:fixed;z-index:25;left:7%;right:22%;bottom:12px;text-align:center;font:13px Georgia,"Times New Roman",serif;letter-spacing:.6px;color:rgba(235,220,195,.78);text-shadow:0 1px 5px #000;pointer-events:none}@media(max-width:900px){.gallery{left:4%;right:18%;gap:10px}.photoFrame{width:42vw}.identity{left:5%;right:35%;bottom:42%}.identity h1{font-size:34px}.identity p{font-size:15px}.tab{width:100px}.content{padding-left:8vw;padding-right:15vw}.content h2{font-size:42px}.aboutScroll{right:12vw;width:72vw;font-size:17px}.contactGrid{grid-template-columns:1fr}}
</style></head><body><main class="site" id="app"></main><script>
const A="assets/",left=["about.png","setar-03.JPG"],right=["saz-zadan3.JPG","portrait.JPG","kham.JPG"],works=[["کمی مواج","Mavvaj","mavvaj.mp3"],["توهم کرکس","Karkas Illusion","karkas.mp3",30,15,3],["حس سبز","Green Sense","hess.mp3"],["کوچه پس‌کوچه خیال","Koocheh-Pas-Koocheh Khial","kooche.mp3"],["دگره‌ای ناگاه","Daghareh-i Nagah","daghareh.mp3",40,0,9]];let lang="fa",section="home",playing=null,li=0,ri=0,audio=new Audio(),clickAudio=null;audio.preload="auto";const faNav=[["home","معرفی"],["about","درباره هرمز"],["audio","آثار صوتی"],["events","اجراها و رویدادها"],["contact","در تماس"]],enNav=[["home","Home"],["about","About Hormoz"],["audio","Selected Audio Works"],["events","Performances & Events"],["contact","Contact"]];function playClick(){if(!clickAudio)clickAudio=new Audio(A+"button-pic.mp3");clickAudio.currentTime=0;clickAudio.volume=1;clickAudio.play().catch(()=>{})}function play(src,key,max,start=0,fade=3,hero=false){if(hero)playClick();audio.pause();audio.loop=false;audio.src=A+src;audio.load();audio.volume=.8;playing=key;render();audio.onloadedmetadata=()=>{audio.currentTime=start;audio.play().catch(()=>{playing=null;render()})};audio.ontimeupdate=()=>{if(max!==undefined){let end=start+max,rem=end-audio.currentTime;if(rem<=fade&&rem>0)audio.volume=.8*rem/fade;if(audio.currentTime>=end){audio.pause();audio.currentTime=0;playing=null;render()}}};audio.onended=()=>{playing=null;render()}}setInterval(()=>{li=(li+1)%left.length;ri=(ri+1)%right.length;if(section==="home")render()},30000);function nav(){return(lang==="en"?enNav:faNav).map(([k,t])=>`<button class="tab ${section===k?"active":""}" onclick="section='${k}';render()">${t}</button>`).join("")}function hero(){let L=left.map((s,i)=>`<img class="heroImage ${i===li?"visible":"hidden"}" src="${A+s}" alt="Setar detail">`).join(""),R=right.map((s,i)=>`<img class="heroImage ${i===ri?"visible":"hidden"}" src="${A+s}" alt="Hormoz Sane portrait">`).join("");return`<section class="hero"><div class="gallery"><div class="photoFrame">${L}<div class="audioHalf audioHalfLeft" onclick="play('mavvaj.mp3','Mavvaj',undefined,0,3,true)"></div><div class="audioHalf audioHalfRight" onclick="play('karkas.mp3','Karkas Illusion',undefined,0,3,true)"></div></div><div class="photoFrame">${R}<div class="audioHalf audioHalfLeft" onclick="play('hess.mp3','Green Sense',undefined,0,3,true)"></div><div class="audioHalf audioHalfRight" onclick="play('kooche.mp3','Koocheh-Pas-Koocheh Khial',undefined,0,3,true)"></div></div></div><div class="identity"><div class="official">${lang==="en"?"OFFICIAL WEBSITE":"وبسایت رسمی"}</div><h1>${lang==="en"?"HORMOZ SANE":"هرمز صانع"}</h1><p>${lang==="en"?"Persian musician and music researcher, focused on the setar and exploring connections between Persian music and other cultures.":"نوازنده و پژوهشگر موسیقی ایرانی، با تمرکز بر ساز سه‌تار و تجربه در پیوند موسیقی ایران با ملل"}</p></div>${playing?`<div class="nowPlaying">${lang==="en"?"Playing":"در حال پخش"} · ${playing}</div>`:""}</section>`}function content(title,body){return`<section class="content"><h2>${title}</h2><div class="mark"></div><div class="copy">${body}</div></section>`}function about(){return`<section class="aboutPage"><img class="aboutBackground" src="${A}about.png"><div class="aboutOverlay"></div><div class="aboutScroll"><h2>${lang==="en"?"About Hormoz":"درباره هرمز"}</h2><div class="mark"></div><div class="copy"><p>${lang==="en"?"Born in Tehran in the autumn, at the beginning of the 1980s; musician, composer, and researcher of Iranian music.":"متولد پاییز طهران، در ابتدای طلوع دهه ۸۰ میلادی؛ نوازنده، آهنگساز و پژوهشگر موسیقی."}</p><p>${lang==="en"?"After years of working in music, teaching, and performing with ensembles, a desire for deeper understanding led Hormoz Sane toward a new path. He reduced his teaching activities and travelled to other countries to experience music and the formation of a multicultural perspective at close range.":"پس از سال‌ها فعالیت در موسیقی، آموزش و همراهی با گروه‌ها، نیاز به فهمیدن بیشتر، هرمز صانع را به مسیری تازه کشاند؛ از حجم تدریس خود کاست و راهی کشورهای دیگر شد تا موسیقی و شکل‌گیری نگاه چندفرهنگی را از نزدیک لمس کند."}</p><p>${lang==="en"?"In Lebanon, he researched books on Arab maqams and encountered another part of the musical world of the region.":"در لبنان، به پژوهش در کتاب‌های مقام‌های عربی پرداخت و با بخشی دیگر از جهان موسیقی منطقه روبه‌رو شد."}</p><p>${lang==="en"?"In Japan, everything initially appeared modern and Western; yet it gradually became clear that Japan was not New York. In architecture and spatial design, a distinct Japanese signature remained present — perhaps not always obvious, but flowing through the atmosphere and details.":"در ژاپن، همه‌چیز مدرن و غربی به نظر می‌رسید؛ اما در نهایت می‌شد احساس کرد اینجا با نیویورک تفاوت دارد. در معماری و حجم‌سازی، هنوز امضای ژاپن حضور داشت؛ امضایی که شاید همیشه قابل لمس نباشد، اما در فضا و جزئیات جریان دارد."}</p><p>${lang==="en"?"This experience brought Hormoz to a new understanding of his own music: belonging to authentic roots and traditions does not prevent new experiences. Those roots can remain intact while musical phrases become more energetic, yet also deeper, quieter, and more open to new ideas.":"این تجربه، هرمز را به دریافت تازه‌ای از موسیقی خود رساند؛ اینکه تعلق به مکتب‌ها و ریشه‌های اصیل، مانعی برای تجربه‌های تازه نیست. می‌توان با حفظ این ریشه‌ها، با جمله‌سازی‌هایی پرهیجان، اما همراه با عمق و سکوت بیشتر، حرف‌هایی جدی‌تر و جدیدتر زد."}</p><p>${lang==="en"?"On the way to a concert in Yokohama, two different ideas came to him, each later continuing in his work in its own form. One became “Karkas Illusion”, an artwork that is also presented among the pieces on this website.":"در مسیر بازگشت به این نگاه، در راه کنسرتی در یوکوهاما دو ایده متفاوت نیز به ذهن هرمز رسید که بعدها هرکدام به شکلی در آثار او ادامه پیدا کردند. یکی از آنها «توهم کرکس» است؛ اثری که در بخش آثار قابل تهیه سایت نیز معرفی خواهد شد."}</p><p>${lang==="en"?"Later, another form of musical expression began to take shape in his mind, built around the central phrase of Surah At-Takwir.":"در ادامه، شکل‌گیری نوع دیگری از بیان در ذهن او آغاز شد؛ تجربه‌ای که در قالب جمله اصلی سوره تکویر شکل گرفت."}</p><p>${lang==="en"?"“Daghareh-i Nagah” grew from this experience: a piece formed boldly and passionately around a ten-minute idea, then written and recorded with three friends in less than eight hours.":"«دگره‌ای ناگاه» حاصل همین تجربه است؛ قطعه‌ای که هرمز آن را بی‌پروا و عاشقانه، با ایده‌ای ده‌دقیقه‌ای شکل داد و در کمتر از هشت ساعت، با همکاری سه دوست، نوشته و ضبط شد."}</p><p>${lang==="en"?"Today, this path remains a continuation of the same search for Hormoz Sane — a search between roots and the connections that grow from them.":"امروز، این مسیر برای هرمز صانع ادامه همان جست‌وجوست؛ جست‌وجویی میان ریشه‌ها و پیوند آنها."}</p></div></div></section>`}function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";let body=section==="home"?hero():section==="about"?about():section==="audio"?content(lang==="en"?"Selected Audio Works":"منتخب برخی آثار صوتی",`<div class="workList">${works.map(w=>`<article class="work"><h3>${lang==="en"?w[1]:w[0]}</h3>${w[3]!==undefined?`<button class="play" onclick="play('${w[2]}','${w[1]}',${w[3]},${w[4]},${w[5]})">${playing===w[1]?(lang==="en"?"Playing…":"در حال پخش…"):(lang==="en"?"Play":"پخش")}</button>`:""}</article>`).join("")}</div>`):section==="events"?content("PERFORMANCES & EVENTS",`<p class="emptyEvent">${lang==="en"?"Events will appear here as performances and contracts are confirmed.":"رویدادها و اجراهای آینده پس از نهایی‌شدن قراردادها در این بخش نمایش داده می‌شوند."}</p>`):content(lang==="en"?"Contact":"در تماس",`<div class="contactGrid"><div><span>INSTAGRAM</span><br><a href="https://www.instagram.com/SETAR-HEKAYAT/" target="_blank" rel="noreferrer">SETAR-HEKAYAT</a></div><form onsubmit="event.preventDefault()"><input placeholder="${lang==="en"?"Name":"نام"}"><input type="email" placeholder="Email"><textarea placeholder="${lang==="en"?"Message":"پیام"}" rows="6"></textarea><button type="submit">${lang==="en"?"Send Message":"ارسال پیام"}</button></form></div>`);document.getElementById("app").innerHTML=`<div class="languageBar"><button class="langButton" onclick="lang='fa';render()">فارسی</button><span>·</span><button class="langButton" onclick="lang='en';render()">English</button></div><nav class="nav">${nav()}</nav>${body}<footer class="footer">© 2026 Hormoz Sane — ${lang==="en"?"All Rights Reserved":"کلیه حقوق محفوظ است"}</footer>`}render();
</script></body></html>
