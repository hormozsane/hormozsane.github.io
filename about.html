<script>

let lang=new URLSearchParams(location.search).get("lang")==="fa"?"fa":"en";
const originalAbout=()=>`<section class="aboutPage"><img class="aboutBackground" src="${A}about.png"><div class="aboutOverlay"></div><div class="aboutScroll"><img class="profilePortrait" src="${A}portrait.JPG" alt="${lang==="en"?"Portrait of Hormoz Sane":"پرتره هرمز صانع"}"><h2>${lang==="en"?"About Hormoz":"درباره هرمز"}</h2><div class="mark"></div><div class="copy"><p>${lang==="en"?"Born in Tehran in the autumn of the early 1980s, Hormoz Sane is a musician, composer, and researcher of Iranian music.":"متولد پاییز طهران، در ابتدای طلوع دهه ۸۰ میلادی؛ نوازنده، آهنگساز و پژوهشگر موسیقی."}</p><p>${lang==="en"?"After years of working in music, teaching, and performing with ensembles, a desire for deeper understanding led Hormoz Sane toward a new path. He gradually reduced his teaching activities and travelled to other countries, experiencing music and the formation of a multicultural perspective at close range.":"پس از سال‌ها فعالیت در موسیقی، آموزش و همراهی با گروه‌ها، نیاز به فهمیدن بیشتر، هرمز صانع را به مسیری تازه کشاند؛ از حجم تدریس خود کاست و راهی کشورهای دیگر شد تا موسیقی و شکل‌گیری نگاه چندفرهنگی را از نزدیک لمس کند."}</p><p>${lang==="en"?"In Lebanon, he studied books on Arab maqams and encountered another part of the region’s musical world.":"در لبنان، به پژوهش در کتاب‌های مقام‌های عربی پرداخت و با بخشی دیگر از جهان موسیقی منطقه روبه‌رو شد."}</p><p>${lang==="en"?"In Japan, everything initially appeared modern and Western, yet it gradually became clear that Japan was not New York. In architecture and spatial design, a distinct Japanese signature remained — perhaps not always obvious, but present in the atmosphere and details.":"در ژاپن، همه‌چیز مدرن و غربی به نظر می‌رسید؛ اما در نهایت می‌شد احساس کرد اینجا با نیویورک تفاوت دارد. در معماری و حجم‌سازی، هنوز امضای ژاپن حضور داشت؛ امضایی که شاید همیشه قابل لمس نباشد، اما در فضا و جزئیات جریان دارد."}</p><p>${lang==="en"?"This experience led Hormoz to a new understanding of his own music: belonging to authentic roots and traditions does not prevent new experiences. Those roots can remain intact while musical phrases become more energetic, yet also deeper, quieter, and more open to new ideas.":"این تجربه، هرمز را به دریافت تازه‌ای از موسیقی خود رساند؛ اینکه تعلق به مکتب‌ها و ریشه‌های اصیل، مانعی برای تجربه‌های تازه نیست. می‌توان با حفظ این ریشه‌ها، با جمله‌سازی‌هایی پرهیجان، اما همراه با عمق و سکوت بیشتر، حرف‌هایی جدی‌تر و جدیدتر زد."}</p><p>${lang==="en"?"On the way to a concert in Yokohama, two different ideas came to him, each later taking shape in his work in its own way. One became “Karkas Illusion”, which is also presented among the works on this website.":"در مسیر بازگشت به این نگاه، در راه کنسرتی در یوکوهاما دو ایده متفاوت نیز به ذهن هرمز رسید که بعدها هرکدام به شکلی در آثار او ادامه پیدا کردند. یکی از آنها «توهم کرکس» است؛ اثری که در بخش آثار قابل تهیه سایت نیز معرفی خواهد شد."}</p><p>${lang==="en"?"Later, another form of musical expression began to take shape in his mind, built around the central phrase of Surah At-Takwir.":"در ادامه، شکل‌گیری نوع دیگری از بیان در ذهن او آغاز شد؛ تجربه‌ای که در قالب جمله اصلی سوره تکویر شکل گرفت."}</p><p>${lang==="en"?"“Degarei Nagah” grew from this experience: a piece shaped boldly and passionately around a ten-minute idea, then written and recorded with three friends in less than eight hours.":"«دگره‌ای ناگاه» حاصل همین تجربه است؛ قطعه‌ای که هرمز آن را بی‌پروا و عاشقانه، با ایده‌ای ده‌دقیقه‌ای شکل داد و در کمتر از هشت ساعت، با همکاری سه دوست، نوشته و ضبط شد."}</p><p>${lang==="en"?"Today, this path remains a continuation of the same search for Hormoz Sane — a search between roots and the connections that grow from them.":"امروز، این مسیر برای هرمز صانع ادامه همان جست‌وجوست؛ جست‌وجویی میان ریشه‌ها و پیوند آنها."}</p></div></div></section>`;
function renderProfile(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="fa"?"rtl":"ltr";
  document.title=lang==="en"?"About Hormoz Sane | هرمز صانع — Official Artist Profile":"درباره هرمز صانع | Hormoz Sane — وب‌سایت رسمی";
  document.querySelector('meta[name="description"]').content=lang==="en"?"Official profile of Hormoz Sane (هرمز صانع), Iranian musician, composer, and researcher of Iranian music, focused on the setar.":"صفحه رسمی هرمز صانع؛ نوازنده، آهنگساز و پژوهشگر موسیقی ایرانی با تمرکز بر ساز سه‌تار.";
  document.querySelector('link[rel="canonical"]').href="https://hormozsane.github.io/about.html?lang="+lang;
  const translated=originalAbout();
  document.getElementById('profile').innerHTML=`<div class="aboutControls"><a href="index.html?lang=${lang}">${lang==="en"?"← Home":"← صفحهٔ اصلی"}</a><button type="button" onclick="setLang('fa')">فارسی</button><button type="button" onclick="setLang('en')">English</button></div>${translated}<footer class="footer">© 2026 Hormoz Sane — ${lang==="en"?"All Rights Reserved":"کلیه حقوق محفوظ است"}</footer>`;
}
function setLang(next){lang=next;const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u.pathname+u.search);renderProfile()}
renderProfile();
